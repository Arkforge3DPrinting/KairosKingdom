<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kairos Kingdom</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>📖 Kairos Kingdom 📖</h1>

    <p>Scripture Study Workspace</p>


<div class="search-box">

    <input 
        id="searchInput"
        type="text"
        placeholder="Search Scripture..."
    >

    <button id="searchButton">
        Search
    </button>

    <button id="studyButton">
        📚 My Study Notes
    </button>

</div>


</header>


<main class="layout">


<aside class="sidebar">

    <h2>Books (KJV)</h2>

    <div id="bookGrid"></div>

</aside>



    <section class="reader">


        <h2 id="bookTitle">
            Select a Book
        </h2>



        <div id="chapterList"></div>



        <article id="verseContent">

            Select a chapter to begin.

        </article>


    </section>


</main>



<!-- Verse action menu -->

<div id="verseMenu" class="verse-menu">

    <button onclick="toggleHighlight()">
        🖍 Highlight
    </button>

    <button onclick="openNoteBox()">
        📝 Add Note
    </button>

    <button onclick="copyVerse()">
        📋 Copy
    </button>

</div>



<!-- Notes popup -->

<div id="noteBox" class="note-box">

    <textarea 
        id="noteInput"
        placeholder="Write your study notes..."
    ></textarea>


    <button onclick="saveNote()">
        Save Note
    </button>

</div>



<section id="studyPanel" style="display:none;">

    <button id="backBibleButton">
        ← Back to Bible
    </button>


    <h2>
        📚 My Study
    </h2>


    <div id="studyList"></div>


</section>




<script src="app.js"></script>


</body>

</html>
