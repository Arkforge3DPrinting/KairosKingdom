<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkStudy</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <h1>📖 ArkStudy</h1>

    <p>Scripture Study Workspace</p>


    <div class="search-box">

        <input 
            id="searchInput"
            type="text"
            placeholder="Search Scripture..."
        >

        <button id="searchButton">
            Search
        </button>

    </div>

</header>


<main class="layout">


    <aside class="sidebar">

        <h2>Books</h2>

        <div id="bookGrid"></div>

    </aside>


    <section class="reader">


        <h2 id="bookTitle">
            Select a Book
        </h2>


        <div id="chapterList"></div>


        <article id="verseContent">

            Select a chapter to begin.

        </article>


    </section>


</main>


<script src="app.js"></script>

</body>
</html>
